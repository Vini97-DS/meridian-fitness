<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Meu treino</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon.svg" />
<link rel="manifest" id="pwa-manifest" href="" />
<style>
  :root {
    --brand: #C9A84C;
    --brand-accent: #6366F1;
    --on-brand: #111111;
    --bg: #F5F6F8;
    --surface: #FFFFFF;
    --text: #0D1B2A;
    --muted: #5B6B7D;
    --border: rgba(13,27,42,0.12);
    --danger: #B42318;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B0B10;
      --surface: #14141C;
      --text: #F2F4F7;
      --muted: #9AA4B2;
      --border: rgba(255,255,255,0.1);
      --danger: #F97066;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B0B10; --surface: #14141C; --text: #F2F4F7; --muted: #9AA4B2;
    --border: rgba(255,255,255,0.1); --danger: #F97066;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; }
  body { min-height: 100vh; padding: 0 16px; padding-bottom: env(safe-area-inset-bottom); }
  .wrap { max-width: 480px; margin: 0 auto; padding-block: 24px; }
  .brand-head { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .brand-logo { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background: var(--brand);
    color: var(--on-brand); display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
  .brand-name { font-size: 18px; font-weight: 700; overflow-wrap: break-word; min-width: 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .card h1 { font-size: 20px; margin: 0 0 6px; }
  .card p { margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input { width: 100%; min-height: 48px; padding: 12px 14px; font-size: 16px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); margin-bottom: 14px; }
  input:focus { outline: 2px solid var(--brand-accent); outline-offset: 1px; }
  .btn { width: 100%; min-height: 48px; border: none; border-radius: 10px; background: var(--brand);
    color: var(--on-brand); font-size: 16px; font-weight: 700; cursor: pointer; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); margin-top: 10px; }
  .msg { font-size: 14px; min-height: 20px; margin-top: 10px; }
  .msg.err { color: var(--danger); }
  .link-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .hidden { display: none !important; }
  .pill { display: inline-block; font-size: 12px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--brand-accent); color: var(--brand-accent); margin-top: 6px; }
  .placeholder { color: var(--muted); font-size: 14px; text-align: center; padding: 28px 0; }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand-head">
    <div class="brand-logo" id="brand-logo">M</div>
    <div class="brand-name" id="brand-name">Meridian</div>
  </div>

  <!-- Login: passo 1 (e-mail) -->
  <section id="step-email" class="card hidden">
    <h1>Entrar</h1>
    <p>Digite o e-mail cadastrado pelo seu profissional. Enviaremos um código de 6 dígitos.</p>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="voce@email.com" />
    <button class="btn" id="btn-request">Enviar código</button>
    <div class="msg" id="msg-email"></div>
  </section>

  <!-- Login: passo 2 (código) -->
  <section id="step-code" class="card hidden">
    <h1>Digite o código</h1>
    <p>Enviamos um código para <span id="sent-to"></span>. Ele vale por 10 minutos.</p>
    <label for="code">Código</label>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" />
    <button class="btn" id="btn-verify">Entrar</button>
    <button class="btn btn-ghost" id="btn-back">Usar outro e-mail</button>
    <div class="msg" id="msg-code"></div>
  </section>

  <!-- Área logada (o treino do dia entra na sub-entrega 2.3) -->
  <section id="step-home" class="card hidden">
    <h1 id="home-title">Olá</h1>
    <p id="home-sub">Seu treino aparece aqui.</p>
    <div class="placeholder">Em breve: seu treino do dia.</div>
    <button class="btn btn-ghost" id="btn-logout">Sair</button>
  </section>

  <!-- Link inválido -->
  <section id="step-invalid" class="card hidden">
    <h1>Link inválido</h1>
    <p>Peça ao seu profissional o link correto do app.</p>
  </section>

</div>

<script>
(function () {
  const TOKEN_KEY = 'mf_aluno_token';
  const pathParts = location.pathname.split('/').filter(Boolean);
  const personalId = pathParts[0] === 'aluno' && pathParts[1] ? pathParts[1] : null;
  const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  const $ = id => document.getElementById(id);
  const show = id => { ['step-email','step-code','step-home','step-invalid'].forEach(s => $(s).classList.add('hidden')); $(id).classList.remove('hidden'); };
  const setMsg = (id, text, isErr) => { const el = $(id); el.textContent = text || ''; el.className = 'msg' + (isErr ? ' err' : ''); };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function applyBrand(b) {
    const root = document.documentElement;
    root.style.setProperty('--brand', b.primary);
    root.style.setProperty('--brand-accent', b.accent);
    root.style.setProperty('--on-brand', contrastText(b.primary));
    $('brand-name').textContent = b.display_name;
    document.title = b.display_name;
    const logo = $('brand-logo');
    if (b.logo_url) {
      logo.innerHTML = '<img src="' + esc(b.logo_url) + '" alt="" style="width:100%;height:100%;border-radius:10px;object-fit:cover" />';
    } else {
      logo.textContent = b.display_name.slice(0, 1).toUpperCase();
    }
  }

  // Texto preto ou branco, o que tiver mais contraste com a cor do botão
  function contrastText(hex) {
    const h = hex.replace('#', '');
    const [r, g, b] = [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) / 255)
      .map(c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
    const L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    return (1.05 / (L + 0.05)) >= ((L + 0.05) / 0.05) ? '#FFFFFF' : '#111111';
  }

  async function loadBrand() {
    const res = await fetch('/api/aluno/brand/' + personalId);
    if (!res.ok) throw new Error('brand');
    const b = await res.json();
    applyBrand(b);
    $('pwa-manifest').href = '/api/aluno/manifest/' + personalId + '.json';
  }

  async function api(path, opts = {}) {
    const token = localStorage.getItem(TOKEN_KEY);
    const res = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) } }, opts));
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      const e = new Error(err.detail || 'Erro ' + res.status);
      e.status = res.status;
      throw e;
    }
    return res.json();
  }

  let pendingEmail = '';

  $('btn-request').addEventListener('click', async () => {
    const email = $('email').value.trim();
    if (!email || !email.includes('@')) return setMsg('msg-email', 'Informe um e-mail válido.', true);
    const btn = $('btn-request'); btn.disabled = true;
    try {
      await api('/api/aluno/auth/request-code', { method: 'POST', body: JSON.stringify({ email }) });
      pendingEmail = email;
      $('sent-to').textContent = email;
      setMsg('msg-email', '');
      show('step-code');
    } catch (e) {
      setMsg('msg-email', e.message, true);
    } finally { btn.disabled = false; }
  });

  $('btn-verify').addEventListener('click', async () => {
    const code = $('code').value.trim();
    if (!/^\d{6}$/.test(code)) return setMsg('msg-code', 'Digite os 6 dígitos.', true);
    const btn = $('btn-verify'); btn.disabled = true;
    try {
      const r = await api('/api/aluno/auth/verify-code', { method: 'POST', body: JSON.stringify({ email: pendingEmail, code }) });
      localStorage.setItem(TOKEN_KEY, r.token);
      await enterHome();
    } catch (e) {
      setMsg('msg-code', e.message, true);
    } finally { btn.disabled = false; }
  });

  $('btn-back').addEventListener('click', () => { setMsg('msg-code', ''); show('step-email'); });

  $('btn-logout').addEventListener('click', () => {
    localStorage.removeItem(TOKEN_KEY);
    show('step-email');
  });

  async function enterHome() {
    const me = await api('/api/aluno/me');
    const mine = me.students || [];
    const fullName = (me.name && me.name !== me.email) ? me.name : (mine[0] ? mine[0].name : '');
    const name = (fullName || 'aluno').split(' ')[0];
    $('home-title').textContent = 'Olá, ' + name;
    $('home-sub').textContent = mine.length
      ? 'Seus treinos com ' + mine.map(s => s.personal_name).join(', ') + '.'
      : 'Nenhum treino vinculado a este e-mail ainda.';
    show('step-home');
  }

  async function start() {
    if (!personalId || !UUID_RE.test(personalId)) return show('step-invalid');
    try {
      await loadBrand();
    } catch (e) {
      return show('step-invalid');
    }
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
    if (localStorage.getItem(TOKEN_KEY)) {
      try { return await enterHome(); }
      catch (e) { localStorage.removeItem(TOKEN_KEY); }
    }
    show('step-email');
  }

  start();
})();
</script>
</body>
</html>
