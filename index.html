<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Performance Hub · Login</title>
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icons/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#111A2E" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">

  <div class="bg">
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
  </div>

  <main class="auth-center">
    <div class="card">

      <!-- Logo -->
      <div class="card-logo">
        <div class="logo-mark">M</div>
        <div class="logo-text">
          <span class="logo-name">Performance Hub</span>
          <span class="logo-sub">by Meridian Labs</span>
        </div>
      </div>

      <!-- Escolha de perfil -->
      <div id="role-chooser">
        <h1 class="card-title">Bem-vindo</h1>
        <p class="card-desc">Como você quer entrar?</p>
        <button class="btn-primary" id="btn-sou-profissional">Sou profissional</button>
        <button class="btn-primary" id="btn-sou-aluno" style="background:transparent;border:1px solid rgba(255,255,255,0.2);margin-top:10px">Sou aluno</button>
      </div>

      <!-- Login do profissional (email + senha) -->
      <div id="form-profissional" style="display:none">
        <button type="button" id="btn-voltar-chooser" style="background:none;border:none;color:var(--muted,#8a94a6);cursor:pointer;font-size:13px;padding:0;margin-bottom:14px">← Voltar</button>
        <h1 class="card-title">Bem-vindo <em>de volta</em></h1>
        <p class="card-desc">Acesse sua conta para acompanhar seus alunos e métricas de negócio.</p>

        <!-- Alerta de erro -->
        <div class="alert alert-error" id="login-error" style="display:none"></div>

        <div class="field">
          <label class="field-label" for="email">E-mail</label>
          <input class="field-input" id="email" type="email"
            placeholder="seu@email.com" autocomplete="email" />
        </div>

        <div class="field">
          <label class="field-label" for="password">Senha</label>
          <div class="field-wrap">
            <input class="field-input" id="password" type="password"
              placeholder="••••••••" autocomplete="current-password" />
            <span class="field-eye" id="toggle-pass">👁</span>
          </div>
        </div>

        <button class="btn-primary" id="login-btn">Entrar</button>

        <div class="card-footer">
          <span class="card-footer-note">
            Primeiro acesso?
            <a href="/primeiro-acesso">Criar senha</a>
          </span>
          <span class="card-footer-note">
            <a id="forgot-link" href="#">Esqueci a senha</a>
          </span>
        </div>
      </div>

    </div>
  </main>

  <script>
    document.getElementById('btn-sou-profissional').addEventListener('click', () => {
      document.getElementById('role-chooser').style.display = 'none';
      document.getElementById('form-profissional').style.display = 'block';
    });
    document.getElementById('btn-voltar-chooser').addEventListener('click', () => {
      document.getElementById('form-profissional').style.display = 'none';
      document.getElementById('role-chooser').style.display = 'block';
    });
    // Aluno não tem usuário/senha — é login por código de 6 dígitos no
    // e-mail, por isso vai pra um fluxo à parte (/aluno), que não exige
    // saber o link específico do profissional: resolve sozinho depois
    // do código, a partir de qual(is) profissional(is) o e-mail do aluno
    // está vinculado (ver aluno.html, "modo resolver" quando a URL não
    // tem personal_id).
    document.getElementById('btn-sou-aluno').addEventListener('click', () => {
      location.href = '/aluno';
    });
  </script>
  <script src="js/auth.js"></script>
</body>
</html>
